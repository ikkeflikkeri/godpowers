name: Publish extension pack

# Manually publish a first-party extension pack to npm. Triggered from
# the GitHub Actions UI (workflow_dispatch). Bump the pack's package.json
# version first, then run this workflow with the pack name.

on:
  workflow_dispatch:
    inputs:
      pack:
        description: 'Pack to publish (security-pack, launch-pack, data-pack)'
        required: true
        type: choice
        options:
          - security-pack
          - launch-pack
          - data-pack

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @godpowers/${{ inputs.pack }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned official Agent Skills validator
        run: python -m pip install -r requirements/skills-ref.txt

      - name: Verify pack publishability
        run: npm run release:check

      - name: Verify fresh pre-publication gate
        run: npm run release:prepublication:check

      - name: Publish pack
        working-directory: extensions/${{ inputs.pack }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: npm publish --access public
