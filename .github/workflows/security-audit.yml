name: Security audit

# Dependabot already opens a pull request within a minute of an alert. What it
# cannot do is make the repository's own gates notice, and ci.yml closes only
# part of that. Two gaps remain:
#
#   1. ci.yml runs `npm run test:audit` on push and pull_request only. On a
#      quiet stretch nothing evaluates the tree at all, so a production
#      advisory waits for the next push. GHSA-8j4g-w8fx-2239 (hono) was
#      published mid-afternoon and first surfaced as a failed publish run.
#
#   2. `test:audit` runs `npm audit --omit=dev`, so a development-scope
#      advisory can never fail CI at any point. All three brace-expansion
#      alerts were development scope, and Dependabot was the only thing in the
#      system that saw them.
#
# This job asks the registry every morning against the committed lockfile, in
# both scopes, so either kind turns a scheduled run red within a day without
# anybody pushing a commit.

on:
  schedule:
    # 06:10 UTC daily. Off the hour, because the top of the hour is when
    # GitHub's scheduled-workflow queue is most congested and runs get delayed.
    - cron: '10 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: Advisory scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Same scope and same command as the release gate, so a red run here means
      # the next release would have been blocked.
      - name: Production advisories
        run: npm audit --omit=dev

      # Development advisories cannot reach an installed copy of Godpowers, but
      # they do reach every contributor running the coverage gate from a clone,
      # so they fail this job too rather than being reported and ignored.
      - name: Full-tree advisories, development included
        run: npm audit
