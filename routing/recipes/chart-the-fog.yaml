apiVersion: godpowers/v1
kind: Recipe
metadata:
  name: chart-the-fog
  category: planning
  description: "Chart the decisions between here and a nameable destination"

triggers:
  intent-keywords:
    - "too big for one session"
    - "chart the decisions"
    - "map the decisions"
    - "what do we need to decide first"
    - "I can name the goal but not the steps"
  state-conditions:
    - "state:initialized == true"

sequences:
  default:
    description: "Name the destination, chart the fog, then resolve one decision at a time"
    steps:
      - command: "/god-chart <the idea>"
        why: "Name the destination and break the fog into decision units"
        wait-for: user-confirm
      - command: "/god-stories --frontier"
        why: "See which units are takeable now"
      - command: "/god-chart --work <chart-slug>"
        why: "Resolve one unit per session until nothing is left to decide"
        wait-for: user-confirm
      - command: "/god-prd"
        why: "Hand the resolved decisions to planning once the way is clear"
        skip-when: chart-still-has-open-units

default-sequence: default
